<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión Seguro</title>
    <style>
        :root {
            --bg-main: #faf7f2;
            --card-bg: #fffdfa;
            --text-primary: #3a3245;
            --text-secondary: #837a92;
            --brand-blue: #6a4fd6;
            --brand-dark: #563fb8;
            --border-color: #e8e0d6;
            --error-bg: #fdf0ef;
            --error-border: #f3c8c4;
            --error-text: #a13d34;
            --success-bg: #f0f9f0;
            --success-border: #bfe3c2;
            --success-text: #2f7d4f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 20px 45px -25px rgba(90,70,140,0.3);
            padding: 32px;
        }
        h2 { color: var(--text-primary); font-size: 1.3rem; margin-bottom: 4px; }
        .sub { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 22px; }
        label { display:block; font-size:0.85rem; font-weight:600; color:#574f66; margin-bottom:6px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.92rem;
            margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: var(--brand-blue); }
        button {
            width: 100%;
            background-color: var(--brand-blue);
            color: #fff;
            border: none;
            padding: 11px;
            font-size: 0.92rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background-color: var(--brand-dark); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
        }
        .msg.error { display:block; background: var(--error-bg); border:1px solid var(--error-border); color: var(--error-text); }
        .msg.success { display:block; background: var(--success-bg); border:1px solid var(--success-border); color: var(--success-text); }
    </style>
</head>
<body>
    <div class="card">
        <h2>Acceso al Sistema</h2>
        <div class="sub">Seguridad de la Información · Universidad El Bosque</div>

        <form id="loginForm">
            <div>
                <label for="username">Usuario / Email:</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" id="submitBtn">Iniciar Sesión</button>
        </form>

        <div id="msg" class="msg"></div>
    </div>

    <script>
        // IMPORTANTE: este script NO valida credenciales, NO calcula hashes
        // y NO decide bloqueos. Solo envía el POST al servidor y muestra
        // la respuesta. Toda la seguridad vive en el backend (ver routes/auth.js
        // y middleware/bruteForceProtection.js), tal como exige la guía.
        const form = document.getElementById("loginForm");
        const msg = document.getElementById("msg");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            msg.className = "msg";
            msg.textContent = "";

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const resp = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();

                if (resp.ok) {
                    window.location.href = '/index.html';
                } else {
                    msg.className = "msg error";
                    msg.textContent = data.error || "Ocurrió un error.";
                }
            } catch (err) {
                msg.className = "msg error";
                msg.textContent = "No se pudo contactar al servidor.";
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
